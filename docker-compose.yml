services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vatai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vatai
    ports:
      - "5432:5432"
    volumes:
      - vatai_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vatai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vatai_pgdata:
